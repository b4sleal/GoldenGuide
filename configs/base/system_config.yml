system:
  logging:
      level: INFO
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  oidc:
    # Plain HTTP is allowed only for the local development identity provider.
    local_development_hosts: [localhost, 127.0.0.1, keycloak, keycloak.localhost]
    http_timeout_seconds: 10
    # Tolerated difference between the API and identity provider clocks.
    clock_skew_seconds: 60
    # Keep signature verification restricted to the existing algorithm.
    id_token_algorithms: [RS256]
  # Background jobs (crawls, imports, indexing). While one runs it refreshes a heartbeat; a sweep fails
  # running runs with no heartbeat for zombie_timeout_minutes (their process restarted or crashed
  # mid-job) and queued runs never picked up within queued_timeout_minutes.
  jobs:
    # in_process: jobs run inside the API (development). worker: queued and run by the `worker`
    # container (docs/backend/architecture.md#background-jobs); staging/production should use worker.
    execution: ${secrets:JOBS__EXECUTION,in_process}
    worker:
      concurrency: 1
      # Must stay below the compose worker's stop_grace_period, or Docker kills jobs mid-shutdown.
      shutdown_graceful_timeout_seconds: 60
      db_pool_max_size: 4
      # Parsing runs in this many child processes, in parallel. Match the worker's CPUs (WORKER_CPUS,
      # 2.0 by default); each child also uses memory (WORKER_MEMORY_LIMIT, 2g by default).
      compute_processes: 2
    heartbeat_seconds: 30
    zombie_timeout_minutes: 5
    # Runs may wait in a worker queue behind long jobs; only a run never picked up in a day is failed.
    queued_timeout_minutes: 1440
    zombie_sweep_seconds: 120
  # Machine callers that authenticate with "Authorization: Bearer <key>" instead of signing in.
  # Grant each only the scopes it needs. Key hashes come from secrets (never the keys themselves);
  # a client whose hashes are unset is disabled. Create a key and its hash with:
  #   python -m backend.core.startup.service_key <client_name>
  # Two hashes allow rotation: set the new one, switch the caller, then clear the previous one.
  service_clients:
    github_actions_nightly:
      scopes: [sources:collect, indexing:sync, jobs:read]
      key_hashes:
        - ${secrets:SERVICE_CLIENT__GITHUB_ACTIONS_NIGHTLY__KEY_HASH}
        - ${secrets:SERVICE_CLIENT__GITHUB_ACTIONS_NIGHTLY__PREVIOUS_KEY_HASH}
    # Frontend type generation (pnpm gen:api) reads /openapi.json. Development only: leave unset elsewhere.
    openapi_codegen:
      scopes: [docs:read]
      key_hashes:
        - ${secrets:SERVICE_CLIENT__OPENAPI_CODEGEN__KEY_HASH}
        - ${secrets:SERVICE_CLIENT__OPENAPI_CODEGEN__PREVIOUS_KEY_HASH}
