<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GoldenGuide</title>
    <link rel="icon" href="GoldenGuideLogo.png" type="image/x-icon">

    <!-- Pico first, our styles last, so GoldenGuide's rules (e.g. answer tables) override the framework. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">

    <!-- Exact versions + integrity hashes: the browser refuses the file if the CDN ever serves
         different bytes (supply-chain protection), and upgrades happen deliberately, not silently. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
            integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"
            integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx"
            crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>

<main class="container">
    <div>
        <div class="header-row">
            <img src="GoldenGuideLogo.png" alt="logo" id="logo">
            <h1>GoldenGuide</h1>
        </div>

        <h3>Your new AI academic assistant for WLU</h3>
    </div>

    <article>
        <label for="question"></label><textarea id="question" rows="4" placeholder="Ask a question... (e.g., What are the course requirements for Psychology?)"></textarea>
        <button id="submit-btn">Ask GoldenGuide</button>
        <em>Note: GoldenGuide can make mistakes! Always check the provided sources.</em>
        Registration details may change. Please verify in</em>
        <a href="https://loris.wlu.ca/register/ssb/registration/registration" target="_blank">LORIS</a>
        <em> before making registration decisions.</em>
    </article>

    <article id="answer-container">
        <div id="answer-content"></div>
    </article>
</main>
</body>
</html>
