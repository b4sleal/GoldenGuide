# Alembic CLI configuration for developers. Applications and tests do not read this file:
# they build their config in code (src/backend/infra/persistence/db/migrations/runner.py).
#
# The database URL is intentionally NOT here. env.py loads it from GoldenGuide's normal config
# (configs/ + .env), so no credentials live in this file.
#
# Common commands (run from the repo root):
#   uv run alembic revision --autogenerate -m "describe the change"   # write a new migration
#   uv run alembic upgrade head                                       # apply migrations
#   uv run alembic upgrade head --sql                                 # print SQL for DBA review
#   uv run alembic history                                            # list migrations

[alembic]
script_location = %(here)s/src/backend/infra/persistence/db/migrations
prepend_sys_path = src
# Migration file names: date first, so `ls versions/` reads chronologically.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
